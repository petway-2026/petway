services:
  mysql:
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

  backend:
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TOUR_API_KEY: ${TOUR_API_KEY:?TOUR_API_KEY is required}
      WEATHER_SHORT_TERM_API_KEY: ${WEATHER_SHORT_TERM_API_KEY:?WEATHER_SHORT_TERM_API_KEY is required}
      WEATHER_MID_TERM_API_KEY: ${WEATHER_MID_TERM_API_KEY:?WEATHER_MID_TERM_API_KEY is required}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      KAKAO_REDIRECT_URI: https://${APP_DOMAIN:?APP_DOMAIN is required}/login/oauth2/code/kakao
      FRONTEND_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      SESSION_COOKIE_SAME_SITE: lax

  frontend:
    build:
      args:
        VITE_API_URL: /
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:?VITE_KAKAO_MAP_KEY is required}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx/default.https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

/* Java 17 기반 백엔드의 의존성과 테스트·선택적 실제 API 검증 작업을 정의한다. */
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.petway'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // OAuth2 - Kakao 로그인 연결할 예정이면 추가
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

    // OpenAI official Java SDK
    implementation('com.openai:openai-java:4.52.0') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Coordinate transformation (EPSG:5174 -> WGS84)
    implementation 'org.locationtech.proj4j:proj4j:1.4.3'
    implementation 'org.locationtech.proj4j:proj4j-epsg:1.4.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Opt-in read-only live verification; requires TOUR_API_KEY and caps KTO requests at 15.
tasks.register('verifyNearbyPagination', JavaExec) {
    group = 'verification'
    description = 'Verify merged nearby pagination against KTO, without a database or user data writes.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.petway.place.service.NearbyPaginationLiveCheck'
}

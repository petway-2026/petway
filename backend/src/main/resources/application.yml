# 공통 애플리케이션 설정이다. 환경별 값은 프로필과 환경변수로 공급한다.
spring:
  application:
    name: petway-backend

  profiles:
    default: dev

  datasource:
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax
animal-hospital-api:
  service-key: ${ANIMAL_HOSPITAL_API_KEY:}

weather:
  timeout:
    connect-timeout: 15000
    read-timeout: 15000
  short:
    base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
    api-key: ${WEATHER_SHORT_TERM_API_KEY}
  mid:
    base-url: https://apis.data.go.kr/1360000/MidFcstInfoService
    api-key: ${WEATHER_MID_TERM_API_KEY}
  seasonal-guide-url: https://www.weather.go.kr/w/pop/rss-guide.do
animal-registration-api:
  base-url: ${ANIMAL_REGISTRATION_API_BASE_URL:https://apis.data.go.kr/1543061/animalInfoSrvc_v3}
  service-key: ${ANIMAL_REGISTRATION_API_KEY:}
  connect-timeout: 3s
  read-timeout: 5s

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorPetTourService2}
  service-key: ${TOUR_API_KEY:}
  mobile-os: ETC
  mobile-app: PetWay
  default-page-size: 20
  connect-timeout: 3s
  read-timeout: 5s

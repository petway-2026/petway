spring:
  application:
    name: petway-backend

  datasource:
    url: jdbc:mysql://localhost:3307/petway?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

server:
  port: 8080

tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_KEY:}
  mobile-os: ETC
  mobile-app: PetWay
  default-page-size: 20
  connect-timeout: 3s
  read-timeout: 5s

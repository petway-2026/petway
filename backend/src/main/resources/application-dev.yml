spring:
  config:
    # Paths support running from backend/ or the repository root.
    import:
      - optional:file:./.env.dev.properties
      - optional:file:./backend/.env.dev.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/petway?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    session:
      cookie:
        secure: false

frontend:
  origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}

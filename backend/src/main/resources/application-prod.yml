spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: ${KAKAO_REDIRECT_URI}

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

frontend:
  origins: ${FRONTEND_ORIGINS}

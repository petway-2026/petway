# 운영 프로필의 데이터베이스·세션·외부 연동 설정이다. 비밀값은 환경변수로 공급한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

frontend:
  origins: ${FRONTEND_ORIGINS}
